<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIP Image Captioning</title>
    <link rel="stylesheet" href="/static/blip_style.css">
</head>
<body>
    <div class="container">
        <h1>BLIP Image Captioning</h1>
        <p class="subtitle">Salesforce BLIP modeli ile görsel açıklama oluşturma</p>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Görseli sürükleyip bırakın veya tıklayarak seçin</p>
                </div>
            </div>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <img id="previewImage" alt="Yüklenen görsel">
            <button class="btn-analyze" id="analyzeBtn">Açıklama Oluştur</button>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <h3>Oluşturulan Açıklama:</h3>
            <p id="captionResult"></p>
            <button class="btn-new-image" id="newImageBtn" style="display: none;">Yeni Resim Yükle</button>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>İşleniyor...</p>
        </div>
    </div>

    <script src="/static/blip_app.js"></script>
</body>
</html>
